apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cd-sample-app-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/REPLACE_ME/cd-learning.git
    targetRevision: main
    path: argocd-app/manifests/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: cd-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
